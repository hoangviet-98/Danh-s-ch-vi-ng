<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách viếng bố Thành</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e2db;
    --accent:#3b5b7a; --accent-soft:#e8eef4; --hl:#fff3b0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;cursor:pointer}
  button:hover{background:var(--accent-soft)}
  .stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#faf9f6;
    position:sticky;top:0;white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  th .arrow{display:inline-block;width:1em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.stt{color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#fbfaf7}
  mark{background:var(--hl);padding:0 1px;border-radius:2px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  @media (max-width:640px){
    th,td{padding:7px 6px;font-size:14px}
    td.grp{font-size:12px;color:var(--muted)}
  }
  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .tablewrap{max-height:none;overflow:visible;border:0}
    th{position:static}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Danh sách viếng bố Thành</h1>

  <div class="card noprint">
    <div class="filters">
      <div class="field">
        <label for="q">Tìm theo tên (không cần gõ dấu)</label>
        <input id="q" type="search" placeholder="Ví dụ: hung, thanh, to 10..." autocomplete="off">
      </div>
      <div class="field">
        <label for="grp">Nhóm</label>
        <select id="grp"></select>
      </div>
      <button id="reset" type="button">Xóa lọc</button>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><div class="k">Số lượt (đang lọc)</div><div class="v" id="stCount">0</div><div class="s" id="stCountAll"></div></div>
    </div>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th>STT</th>
          <th class="sortable" data-key="g">Nhóm <span class="arrow"></span></th>
          <th class="sortable" data-key="n">Người viếng <span class="arrow"></span></th>
          <th class="sortable num" data-key="a">Số tiền <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty" hidden>Không có dòng nào khớp bộ lọc.</div>
  </div>
</div>

  function fold(s){
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
            .replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase();
  }
  DATA.forEach(function(r){ r.f = fold(r.n); r.i = r.r; });

  // Danh sach nhom theo thu tu xuat hien (gop trung ten)
  var groups = [], gstat = {};
  DATA.forEach(function(r){
    if(!gstat[r.g]){ gstat[r.g] = {c:0,t:0}; groups.push(r.g); }
    gstat[r.g].c++; gstat[r.g].t += r.a;
  });

  var el = {
    q: document.getElementById('q'), grp: document.getElementById('grp'),
    reset: document.getElementById('reset'),
    tbody: document.querySelector('#tbl tbody'), empty: document.getElementById('empty'),
    stCount: document.getElementById('stCount'),
    stCountAll: document.getElementById('stCountAll')
  };
  var sortKey = null, sortDir = 1;

  function td(text, cls){
    var c = document.createElement('td');
    if(cls) c.className = cls;
    c.textContent = text;
    return c;
  }

  // Dropdown nhom
  function addOpt(value, label){
    var o = document.createElement('option'); o.value = value; o.textContent = label; el.grp.appendChild(o);
  }
  addOpt(ALL, 'Tất cả nhóm (' + DATA.length + ')');
  groups.forEach(function(g){ addOpt(g, g + ' (' + gstat[g].c + ')'); });

  // Tao noi dung o ten, to sang phan khop (khong dung innerHTML)
  function fillName(cell, name, folded, needle){
    if(!needle){ cell.textContent = name; return; }
    // fold co the doi do dai chuoi (NFD) -> do vi tri theo tung ky tu goc
    var starts = [], acc = '', i;
    for(i = 0; i < name.length; i++){
      starts.push(acc.length);
      acc += fold(name.charAt(i));
    }
    starts.push(acc.length);
    var idx = acc.indexOf(needle);
    if(idx < 0){ cell.textContent = name; return; }
    var end = idx + needle.length, a = -1, b = -1;
    for(i = 0; i < name.length; i++){
      if(a < 0 && starts[i+1] > idx) a = i;
      if(starts[i] < end) b = i + 1;
    }
    if(a < 0 || b <= a){ cell.textContent = name; return; }
    cell.appendChild(document.createTextNode(name.slice(0,a)));
    var m = document.createElement('mark'); m.textContent = name.slice(a,b); cell.appendChild(m);
    cell.appendChild(document.createTextNode(name.slice(b)));
  }

  function render(){
    var needle = fold(el.q.value.trim());
    var g = el.grp.value;
    var rows = DATA.filter(function(r){
      return (g === ALL || r.g === g) && (!needle || r.f.indexOf(needle) !== -1);
    });
    if(sortKey){
      rows = rows.slice().sort(function(x,y){
        var a = x[sortKey], b = y[sortKey], c;
        c = (sortKey === 'a') ? (a - b) : String(a).localeCompare(String(b),'vi');
        return (c || (x.i - y.i)) * sortDir;
      });
    }
    var frag = document.createDocumentFragment();
    rows.forEach(function(r, k){
      var tr = document.createElement('tr');
      tr.appendChild(td(String(k+1),'stt'));
      tr.appendChild(td(r.g,'grp'));
      var nc = document.createElement('td'); fillName(nc, r.n, r.f, needle); tr.appendChild(nc);
      tr.appendChild(td(fmt.format(r.a),'num'));
      frag.appendChild(tr);
    });
    el.tbody.textContent = '';
    el.tbody.appendChild(frag);
    el.empty.hidden = rows.length > 0;

    el.stCount.textContent = fmt.format(rows.length);
    el.stCountAll.textContent = 'Toàn bộ: ' + fmt.format(DATA.length);

    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function(th){
      th.querySelector('.arrow').textContent = (th.dataset.key === sortKey) ? (sortDir > 0 ? '▲' : '▼') : '';
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function(th){
    th.addEventListener('click', function(){
      var k = th.dataset.key;
      if(sortKey === k){ if(sortDir > 0) sortDir = -1; else { sortKey = null; sortDir = 1; } }
      else { sortKey = k; sortDir = 1; }
      render();
    });
  });
  el.q.addEventListener('input', render);
  el.grp.addEventListener('change', render);
  el.reset.addEventListener('click', function(){
    el.q.value = ''; el.grp.value = ALL; sortKey = null; sortDir = 1; render(); el.q.focus();
  });

  render();
})();
</script>
</body>
</html>
