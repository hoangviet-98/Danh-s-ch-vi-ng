<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh sách viếng bố Thành</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e2db;
    --accent:#3b5b7a; --accent-soft:#e8eef4; --hl:#fff3b0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 220px}
  .field label{font-size:12px;color:var(--muted)}
  input[type=search],select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;cursor:pointer}
  button:hover{background:var(--accent-soft)}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#faf9f6;
    position:sticky;top:0;white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--ink)}
  th .arrow{display:inline-block;width:1em}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.stt{color:var(--muted);width:56px;font-variant-numeric:tabular-nums}
  tbody tr:hover{background:#fbfaf7}
  mark{background:var(--hl);padding:0 1px;border-radius:2px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .tablewrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(31,35,40,.55);backdrop-filter:blur(6px)}
  .gate-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .gate-box h2{font-size:18px;margin:0 0 4px}
  .gate-box .hint{margin:0 0 14px;color:var(--muted);font-size:13px}
  .pw-wrap{position:relative}
  .gate-box input{width:100%;padding:10px 40px 10px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;box-sizing:border-box}
  .pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:4px;margin:0;cursor:pointer;color:var(--muted);line-height:1;display:flex;align-items:center;width:auto}
  .pw-toggle:hover{color:var(--ink)}
  .pw-toggle svg{width:20px;height:20px}
  .gate-box button:not(.pw-toggle){margin-top:12px;width:100%;padding:10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;font:inherit;cursor:pointer}
  .gate-box button:not(.pw-toggle):hover{opacity:.9}
  #gate-msg{font-size:13px;color:#b42318;margin:10px 0 0;min-height:1.3em}
  body.locked .wrap{display:none}
  body:not(.locked) .gate{display:none}
  @media (max-width:640px){
    th,td{padding:7px 6px;font-size:14px}
    td.grp{font-size:12px;color:var(--muted)}
  }
  @media print{
    body{background:#fff}
    .noprint{display:none!important}
    .tablewrap{max-height:none;overflow:visible;border:0}
    th{position:static}
  }
</style>
</head>
<body class="locked">

<div id="modal" class="gate noprint" role="dialog" aria-modal="true">
  <form id="gate-form" class="gate-box" autocomplete="off">
    <h2>Nhập mật khẩu</h2>
    <p class="hint">Nhập đúng mật khẩu để xem danh sách.</p>
    <div class="pw-wrap">
      <input id="pw" type="password" autocomplete="off" aria-label="Mật khẩu" required autofocus>
      <button type="button" class="pw-toggle" aria-label="Hiện mật khẩu" onclick="var i=document.getElementById('pw'),s=i.type==='password';i.type=s?'text':'password';this.setAttribute('aria-label',s?'Ẩn mật khẩu':'Hiện mật khẩu');this.innerHTML=s?'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24&quot;/><line x1=&quot;1&quot; y1=&quot;1&quot; x2=&quot;23&quot; y2=&quot;23&quot;/></svg>':'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;><path d=&quot;M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z&quot;/><circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;3&quot;/></svg>'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button id="gate-btn" type="submit">Xác nhận</button>
    <p id="gate-msg" role="status"></p>
  </form>
</div>

<div class="wrap">
  <h1>Danh sách viếng bố Thành</h1>

  <div class="card noprint">
    <div class="filters">
      <div class="field">
        <label for="q">Tìm theo tên (không cần gõ dấu)</label>
        <input id="q" type="search" placeholder="Ví dụ: hung, thanh, to 10..." autocomplete="off">
      </div>
      <div class="field">
        <label for="grp">Nhóm</label>
        <select id="grp"></select>
      </div>
      <button id="reset" type="button">Xóa lọc</button>
    </div>
  </div>

  <div class="tablewrap">
    <table id="tbl">
      <thead>
        <tr>
          <th>STT</th>
          <th class="sortable" data-key="g">Nhóm <span class="arrow"></span></th>
          <th class="sortable" data-key="n">Người viếng <span class="arrow"></span></th>
          <th class="sortable num" data-key="a">Số tiền <span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty" hidden>Không có dòng nào khớp bộ lọc.</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var ENC = JSON.parse(document.getElementById('enc').textContent);

  function b64(s){
    var bin = atob(s), u = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  async function decryptData(pw){
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var ct = b64(ENC.ct);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  var gate = document.getElementById('gate-form');
  var inPw = document.getElementById('pw');
  var btnGate = document.getElementById('gate-btn');
  var msgGate = document.getElementById('gate-msg');
  inPw.focus();

  gate.addEventListener('submit', function(ev){
    ev.preventDefault();
    if(!(window.crypto && crypto.subtle)){
      msgGate.textContent = 'Trình duyệt không hỗ trợ. Hãy dùng Chrome/Safari/Firefox mới.';
      return;
    }
    var pw = inPw.value;
    btnGate.disabled = true;
    msgGate.style.color = 'var(--muted)';
    msgGate.textContent = 'Đang kiểm tra...';
    decryptData(pw).then(function(arr){
      inPw.value = '';
      document.body.classList.remove('locked');
      start(arr);
    }, function(){
      msgGate.style.color = '#b42318';
      msgGate.textContent = 'Sai mật khẩu.';
      inPw.value = ''; inPw.focus();
    }).then(function(){ btnGate.disabled = false; });
  });

  function start(DATA){
    var fmt = new Intl.NumberFormat('vi-VN');
    var ALL = '';

    function fold(s){
      return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
              .replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase();
    }
    DATA.forEach(function(r){ r.f = fold(r.n); r.i = r.r; });

    var groups = [], gstat = {};
    DATA.forEach(function(r){
      if(!gstat[r.g]){ gstat[r.g] = {c:0,t:0}; groups.push(r.g); }
      gstat[r.g].c++; gstat[r.g].t += r.a;
    });

    var el = {
      q: document.getElementById('q'), grp: document.getElementById('grp'),
      reset: document.getElementById('reset'),
      tbody: document.querySelector('#tbl tbody'), empty: document.getElementById('empty')
    };
    var sortKey = null, sortDir = 1;

    function td(text, cls){
      var c = document.createElement('td');
      if(cls) c.className = cls;
      c.textContent = text;
      return c;
    }

    function addOpt(value, label){
      var o = document.createElement('option'); o.value = value; o.textContent = label; el.grp.appendChild(o);
    }
    addOpt(ALL, 'Tất cả nhóm (' + DATA.length + ')');
    groups.forEach(function(g){ addOpt(g, g + ' (' + gstat[g].c + ')'); });

    function fillName(cell, name, folded, needle){
      if(!needle){ cell.textContent = name; return; }
      var starts = [], acc = '', i;
      for(i = 0; i < name.length; i++){
        starts.push(acc.length);
        acc += fold(name.charAt(i));
      }
      starts.push(acc.length);
      var idx = acc.indexOf(needle);
      if(idx < 0){ cell.textContent = name; return; }
      var end = idx + needle.length, a = -1, b = -1;
      for(i = 0; i < name.length; i++){
        if(a < 0 && starts[i+1] > idx) a = i;
        if(starts[i] < end) b = i + 1;
      }
      if(a < 0 || b <= a){ cell.textContent = name; return; }
      cell.appendChild(document.createTextNode(name.slice(0,a)));
      var m = document.createElement('mark'); m.textContent = name.slice(a,b); cell.appendChild(m);
      cell.appendChild(document.createTextNode(name.slice(b)));
    }

    function render(){
      var needle = fold(el.q.value.trim());
      var g = el.grp.value;
      var rows = DATA.filter(function(r){
        return (g === ALL || r.g === g) && (!needle || r.f.indexOf(needle) !== -1);
      });
      if(sortKey){
        rows = rows.slice().sort(function(x,y){
          var a = x[sortKey], b = y[sortKey], c;
          c = (sortKey === 'a') ? (a - b) : String(a).localeCompare(String(b),'vi');
          return (c || (x.i - y.i)) * sortDir;
        });
      }
      var frag = document.createDocumentFragment();
      rows.forEach(function(r, k){
        var tr = document.createElement('tr');
        tr.appendChild(td(String(k+1),'stt'));
        tr.appendChild(td(r.g,'grp'));
        var nc = document.createElement('td'); fillName(nc, r.n, r.f, needle); tr.appendChild(nc);
        tr.appendChild(td(fmt.format(r.a),'num'));
        frag.appendChild(tr);
      });
      el.tbody.textContent = '';
      el.tbody.appendChild(frag);
      el.empty.hidden = rows.length > 0;
      Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function(th){
        th.querySelector('.arrow').textContent = (th.dataset.key === sortKey) ? (sortDir > 0 ? '▲' : '▼') : '';
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll('th.sortable'), function(th){
      th.addEventListener('click', function(){
        var k = th.dataset.key;
        if(sortKey === k){ if(sortDir > 0) sortDir = -1; else { sortKey = null; sortDir = 1; } }
        else { sortKey = k; sortDir = 1; }
        render();
      });
    });
    el.q.addEventListener('input', render);
    el.grp.addEventListener('change', render);
    el.reset.addEventListener('click', function(){
      el.q.value = ''; el.grp.value = ALL; sortKey = null; sortDir = 1; render(); el.q.focus();
    });
    render();
  }
})();
</script>
